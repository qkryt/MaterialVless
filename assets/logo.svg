<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3574F0"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3574F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3574F0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Hexagonal Shield Background & Border -->
  <polygon points="256,20 480,132 480,317 256,492 32,317 32,132"
           fill="url(#shieldBg)"
           stroke="url(#shieldGrad)"
           stroke-width="26"
           stroke-linejoin="round"
           filter="url(#shadow)"/>

  <!-- High-Speed Tunnel V Symbol -->
  <path d="M 144,180 L 256,368 L 368,180"
        fill="none"
        stroke="url(#vGrad)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Dynamic Cyber Pulse Node -->
  <circle cx="256" cy="180" r="32" fill="#00D2FF"/>
  <circle cx="256" cy="180" r="16" fill="#FFFFFF"/>
</svg>
