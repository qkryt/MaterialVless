<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750A4"/>
      <stop offset="50%" stop-color="#7D5260"/>
      <stop offset="100%" stop-color="#D0BCFF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0BCFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6750A4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6750A4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield with Shadow -->
  <polygon points="256,20 480,132 480,317 256,492 32,317 32,132"
           fill="url(#glow)"
           stroke="url(#grad1)"
           stroke-width="24"
           stroke-linejoin="round"
           filter="url(#shadow)"/>

  <!-- High-Speed Tunnel V Symbol -->
  <path d="M 144,180 L 256,368 L 368,180"
        fill="none"
        stroke="url(#grad1)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Dynamic Cyber Pulse Dot -->
  <circle cx="256" cy="180" r="28" fill="#D0BCFF"/>
  <circle cx="256" cy="180" r="14" fill="#FFFFFF"/>
</svg>
