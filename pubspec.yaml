name: material_vless
description: "MaterialVless - Modern VLESS/Reality Client with Xray-core in Material Design 3"
publish_to: "none"
version: 2.14.4+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dynamic_color: 1.7.0
  http: ^1.2.2
  crypto: ^3.0.3
  path_provider: ^2.1.4
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  tray_manager: ^0.2.4
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/rules/
