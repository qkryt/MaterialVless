name: Build & Release MaterialVless

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: '1.14.4'
  WINTUN_VERSION: '0.14.1'
  XRAY_VERSION: 'v24.11.30'

jobs:
  # ==========================================
  # 1. WINDOWS BUILD (x64 and x86)
  # ==========================================
  build-windows:
    name: Build Windows (x64 / x86)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Native Files
        run: flutter create . --platforms=windows --org com.materialvless --project-name material_vless

      - name: Configure Manifest for Wintun Administrator Privileges
        shell: pwsh
        run: |
          $manifestPath = "windows/runner/runner.exe.manifest"
          if (Test-Path $manifestPath) {
            (Get-Content $manifestPath) -replace 'level="asInvoker"', 'level="requireAdministrator"' | Set-Content $manifestPath
          }

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Windows App
        run: flutter build windows --release

      - name: Package Windows x64 and x86 with sing-box and Wintun
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          
          # Загрузка sing-box (x64)
          $Sb64Url = "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-windows-amd64.zip"
          Invoke-WebRequest -Uri $Sb64Url -OutFile "sb64.zip"
          Expand-Archive -Path "sb64.zip" -DestinationPath "sb_64"

          # Загрузка sing-box (x86)
          $Sb32Url = "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-windows-386.zip"
          Invoke-WebRequest -Uri $Sb32Url -OutFile "sb32.zip"
          Expand-Archive -Path "sb32.zip" -DestinationPath "sb_32"

          # Загрузка драйвера Wintun
          $WintunUrl = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"

          # Загрузка баз GeoIP и GeoSite
          $GeoipUrl = "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat"
          $GeositeUrl = "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat"
          Invoke-WebRequest -Uri $GeoipUrl -OutFile "$ReleaseDir/geoip.dat"
          Invoke-WebRequest -Uri $GeositeUrl -OutFile "$ReleaseDir/geosite.dat"

          # Формирование Windows x64
          Copy-Item "sb_64/sing-box-${{ env.SING_BOX_VERSION }}-windows-amd64/sing-box.exe" -Destination "$ReleaseDir/sing-box.exe"
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$ReleaseDir/wintun.dll"

          $manifest = '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>'
          [System.IO.File]::WriteAllText("$ReleaseDir/material_vless.exe.manifest", $manifest)

          # Embed manifest directly into exe with mt.exe if available
          $mt = (Get-Command mt.exe -ErrorAction SilentlyContinue).Source
          if ($mt) {
            & $mt -manifest "$ReleaseDir/material_vless.exe.manifest" "-outputresource:$ReleaseDir/material_vless.exe;1"
          }

          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "MaterialVless-Windows-x64.zip"

          # Формирование Windows x86
          mkdir -p "dist_x86"
          Copy-Item "$ReleaseDir/*" -Destination "dist_x86" -Recurse
          Copy-Item "sb_32/sing-box-${{ env.SING_BOX_VERSION }}-windows-386/sing-box.exe" -Destination "dist_x86/sing-box.exe" -Force
          Copy-Item "wintun_driver/wintun/bin/x86/wintun.dll" -Destination "dist_x86/wintun.dll" -Force
          Compress-Archive -Path "dist_x86/*" -DestinationPath "MaterialVless-Windows-x86.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Windows
          path: MaterialVless-Windows-*.zip

  # ==========================================
  # 2. LINUX BUILD (x64 and x86)
  # ==========================================
  build-linux:
    name: Build Linux (x64 / x86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Linux Native Files
        run: flutter create . --platforms=linux --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Linux App
        run: flutter build linux --release

      - name: Bundle Core & Package x64 and x86
        run: |
          DIST="build/linux/x64/release/bundle"
          
          # Загрузка sing-box (x64)
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-linux-amd64.tar.gz" -o sb64.tar.gz
          tar -xvf sb64.tar.gz
          cp "sing-box-${{ env.SING_BOX_VERSION }}-linux-amd64/sing-box" "$DIST/sing-box"
          chmod +x "$DIST/sing-box"

          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat" -o "$DIST/geoip.dat"
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat" -o "$DIST/geosite.dat"

          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

          # x86 package
          mkdir -p dist_linux_x86
          cp -r "$DIST/"* dist_linux_x86/
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-linux-386.tar.gz" -o sb32.tar.gz
          tar -xvf sb32.tar.gz
          cp "sing-box-${{ env.SING_BOX_VERSION }}-linux-386/sing-box" dist_linux_x86/sing-box
          chmod +x dist_linux_x86/sing-box
          tar -czvf MaterialVless-Linux-x86.tar.gz -C dist_linux_x86 .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Linux
          path: MaterialVless-Linux-*.tar.gz

  # ==========================================
  # 3. MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS (MaterialVless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate macOS Native Files
        run: flutter create . --platforms=macos --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile macOS Application
        run: flutter build macos --release

      - name: Bundle Core & Archive
        run: |
          APP_DIR="build/macos/Build/Products/Release/material_vless.app"
          RES_DIR="$APP_DIR/Contents/Resources"
          mkdir -p "$RES_DIR"

          # Sing-box universal binary (arm64 + amd64)
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-darwin-arm64.tar.gz" -o sb_arm64.tar.gz
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-darwin-amd64.tar.gz" -o sb_amd64.tar.gz
          tar -xzf sb_arm64.tar.gz
          tar -xzf sb_amd64.tar.gz
          lipo -create "sing-box-${{ env.SING_BOX_VERSION }}-darwin-arm64/sing-box" "sing-box-${{ env.SING_BOX_VERSION }}-darwin-amd64/sing-box" -output "$RES_DIR/sing-box"
          chmod +x "$RES_DIR/sing-box"

          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat" -o "$RES_DIR/geoip.dat"
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat" -o "$RES_DIR/geosite.dat"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-macOS
          path: MaterialVless-macOS.zip

  # ==========================================
  # 4. PUBLISH RELEASE
  # ==========================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare Final Files
        run: |
          mkdir -p final_assets
          find release_staging -type f -exec mv {} final_assets/ \;
          ls -la final_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.3.2" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: MaterialVless ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### MaterialVless Client — Релиз ${{ steps.tag_info.outputs.tag }} (TUN Edition)
            
            Полноценный клиент с настоящим ядром **sing-box v1.14** и встроенным драйвером виртуальной сетевой карты **Wintun**.
            
            #### 🌟 Нововведения и исправления:
            - **Полноценный адаптер `material-tun`:** Создаёт системный TUN-интерфейс в сетевых подключениях Windows, перехватывающий 100% трафика (игры, Telegram, Discord, браузеры, DNS).
            - **Нативная поддержка Hysteria 2:** Работает прямо в ядре без сторонних костылей.
            - **Векторные флаги стран:** Высококачественные флаги стран в дизайне Material You, работающие на любой ОС без проблем со шрифтами.
            - **Мгновенное переподключение на лету:** Автоматическая смена сервера без необходимости ручного отключения и включения VPN.
            - **Удалена анимация кнопки:** Кнопка подключения статична и мгновенно откликается.
            - **Поддержка любых подписок:** Корректный импорт AliusVPN и Marzban с автоматическим обходом блокировки User-Agent.
            
            #### Поддерживаемые платформы:
            - **Windows (x64):** `MaterialVless-Windows-x64.zip` (sing-box + Wintun x64)
            - **Windows (x86):** `MaterialVless-Windows-x86.zip` (sing-box + Wintun x86)
            - **Linux (x64):** `MaterialVless-Linux-x64.tar.gz` (sing-box 64-bit)
            - **Linux (x86):** `MaterialVless-Linux-x86.tar.gz` (sing-box 32-bit)
            - **macOS:** `MaterialVless-macOS.zip` (Universal sing-box)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
