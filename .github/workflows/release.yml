name: Build & Release MaterialVless

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.3'
  XRAY_VERSION: 'v24.11.30'
  WINTUN_VERSION: '0.14.1'

jobs:
  build-windows:
    name: Build Windows x64 (MaterialVless)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Windows Executable
        run: flutter build windows --release

      - name: Fetch Xray-core & Wintun Driver
        shell: pwsh
        run: |
          $TargetDir = "build/windows/x64/runner/Release"
          
          # Загрузка официального ядра Xray-core
          $XrayArchive = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $XrayArchive -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray_core"
          
          Copy-Item "xray_core/xray.exe" -Destination "$TargetDir"
          Copy-Item "xray_core/geoip.dat" -Destination "$TargetDir"
          Copy-Item "xray_core/geosite.dat" -Destination "$TargetDir"
          
          # Загрузка драйвера виртуального адаптера Wintun
          $WintunArchive = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunArchive -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$TargetDir"

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "MaterialVless-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Windows-x64
          path: MaterialVless-Windows-x64.zip

  build-android:
    name: Build Android APKs (MaterialVless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release APKs (Split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Organize Android APKs
        run: |
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/MaterialVless-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apks/MaterialVless-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk output_apks/MaterialVless-Android-x86_64.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Android-APKs
          path: output_apks/*.apk

  build-linux:
    name: Build Linux x64 (MaterialVless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Toolchain & GTK3
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Linux App
        run: flutter build linux --release

      - name: Bundle Core & Package
        run: |
          DIST="build/linux/x64/release/bundle"
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip" -o xray.zip
          unzip xray.zip -d xray_temp
          cp xray_temp/xray "$DIST/"
          cp xray_temp/geoip.dat "$DIST/"
          cp xray_temp/geosite.dat "$DIST/"
          chmod +x "$DIST/xray"
          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Linux-x64
          path: MaterialVless-Linux-x64.tar.gz

  build-macos:
    name: Build macOS (MaterialVless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile macOS Application
        run: flutter build macos --release

      - name: Bundle Core & Archive App
        run: |
          APP_DIR="build/macos/Build/Products/Release/material_vless.app"
          RES_DIR="$APP_DIR/Contents/Resources"
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-macos-arm64-v8a.zip" -o xray.zip
          unzip xray.zip -d xray_temp
          mkdir -p "$RES_DIR"
          cp xray_temp/xray "$RES_DIR/"
          cp xray_temp/geoip.dat "$RES_DIR/"
          cp xray_temp/geosite.dat "$RES_DIR/"
          chmod +x "$RES_DIR/xray"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-macOS
          path: MaterialVless-macOS.zip

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-android, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare Final Files
        run: |
          mkdir -p final_assets
          find release_staging -type f -exec mv {} final_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MaterialVless ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### MaterialVless Client — Релиз ${{ github.ref_name }}
            
            Полноценный кроссплатформенный клиент VLESS / Reality / gRPC с ядром Xray-core и интерфейсом Material You (M3).
            
            #### Готовые сборки:
            - **Windows (x64):** `MaterialVless-Windows-x64.zip` (содержит `wintun.dll`, `xray.exe`, GeoIP/GeoSite).
            - **Android:** Split APKs для архитектур `arm64-v8a`, `armeabi-v7a`, `x86_64`.
            - **Linux (x64):** `MaterialVless-Linux-x64.tar.gz`.
            - **macOS:** `MaterialVless-macOS.zip`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}