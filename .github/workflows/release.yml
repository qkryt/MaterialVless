name: Build & Release MaterialVless

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:



permissions:

  contents: write



env:
  WINTUN_VERSION: '0.14.1'
  XRAY_VERSION: 'v26.10.21'



jobs:

  # ==========================================

  # 1. WINDOWS BUILD (x64 and x86)

  # ==========================================

  build-windows:

    name: Build Windows (x64 / x86)

    runs-on: windows-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: 'stable'

          cache: true



      - name: Enable Windows Desktop

        run: flutter config --enable-windows-desktop



      - name: Generate Windows Native Files

        run: flutter create . --platforms=windows --org com.materialvless --project-name material_vless



      - name: Setup App Icon and Window Title in Windows Runner

        shell: pwsh

        run: |

          if (Test-Path 'assets/icons/app_icon.ico') {

            New-Item -ItemType Directory -Path 'windows/runner/resources' -Force

            Copy-Item 'assets/icons/app_icon.ico' 'windows/runner/resources/app_icon.ico' -Force

          }

          $mainCpp = "windows/runner/main.cpp"

          if (Test-Path $mainCpp) {

            (Get-Content $mainCpp) -replace 'L"material_vless"', 'L"MaterialVless"' | Set-Content $mainCpp

          }

          $rcFile = "windows/runner/Runner.rc"

          if (Test-Path $rcFile) {

            (Get-Content $rcFile) -replace '"material_vless"', '"MaterialVless"' | Set-Content $rcFile

          }



      - name: Configure Manifest for Wintun Administrator Privileges

        shell: pwsh

        run: |

          $manifestPath = "windows/runner/runner.exe.manifest"

          if (Test-Path $manifestPath) {

            (Get-Content $manifestPath) -replace 'level="asInvoker"', 'level="requireAdministrator"' | Set-Content $manifestPath

          }



      - name: Install Dependencies

        run: flutter pub get



      - name: Compile Windows App

        run: flutter build windows --release



      - name: Install Inno Setup

        shell: pwsh

        run: |

          choco install innosetup -y --no-progress



      - name: Package Windows x64 and x86 with Xray Core
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"

          # Download Xray-core (x64)
          $Xray64Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $Xray64Url -OutFile "xray64.zip"
          Expand-Archive -Path "xray64.zip" -DestinationPath "xray_64"

          # Download Xray-core (x86)
          $Xray32Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-32.zip"
          Invoke-WebRequest -Uri $Xray32Url -OutFile "xray32.zip"
          Expand-Archive -Path "xray32.zip" -DestinationPath "xray_32"

          # Download Wintun driver
          $WintunUrl = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"

          # GeoIP and GeoSite from Xray
          Copy-Item "xray_64/geoip.dat" -Destination "$ReleaseDir/geoip.dat" -Force
          Copy-Item "xray_64/geosite.dat" -Destination "$ReleaseDir/geosite.dat" -Force

          # Form Windows x64 package
          Copy-Item "xray_64/xray.exe" -Destination "$ReleaseDir/xray.exe" -Force
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$ReleaseDir/wintun.dll" -Force

          # Bundle Microsoft Visual C++ Runtime libraries (msvcp140.dll, vcruntime140.dll, etc.)
          $vcRedistDir = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($vcRedistDir) {
            $x64Crt = Join-Path $vcRedistDir.FullName "x64\Microsoft.VC143.CRT"
            if (Test-Path $x64Crt) {
              Copy-Item "$x64Crt\*.dll" -Destination "$ReleaseDir" -Force
              Write-Host "Bundled Visual C++ x64 runtime libraries from $x64Crt"
            }
          }
          $crtDlls = @("msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll", "vcruntime140.dll", "vcruntime140_1.dll", "vcomp140.dll")
          foreach ($dll in $crtDlls) {
            if (!(Test-Path "$ReleaseDir\$dll") -and (Test-Path "C:\Windows\System32\$dll")) {
              Copy-Item "C:\Windows\System32\$dll" -Destination "$ReleaseDir" -Force
            }
          }
          try {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$ReleaseDir/vc_redist.x64.exe" -UseBasicParsing
          } catch {
            Write-Host "Warning: Could not download vc_redist.x64.exe"
          }


          if (Test-Path "assets/icons/app_icon.ico") {
            Copy-Item "assets/icons/app_icon.ico" -Destination "$ReleaseDir/app_icon.ico"
          }

          New-Item -ItemType Directory -Path "$ReleaseDir/customfonts" -Force
          New-Item -ItemType Directory -Path "$ReleaseDir/backgrounds" -Force

          $manifest = '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>'
          [System.IO.File]::WriteAllText("$ReleaseDir/material_vless.exe.manifest", $manifest)

          # Embed manifest directly into exe with mt.exe if available
          $mt = (Get-Command mt.exe -ErrorAction SilentlyContinue).Source
          if ($mt) {
            & $mt -manifest "$ReleaseDir/material_vless.exe.manifest" "-outputresource:$ReleaseDir/material_vless.exe;1"
          }

          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "MaterialVless-Windows-x64.zip"

          # Form Windows x86 package
          mkdir -p "dist_x86"
          Copy-Item "$ReleaseDir/*" -Destination "dist_x86" -Recurse
          Copy-Item "xray_32/xray.exe" -Destination "dist_x86/xray.exe" -Force
          Copy-Item "wintun_driver/wintun/bin/x86/wintun.dll" -Destination "dist_x86/wintun.dll" -Force

          if ($vcRedistDir) {
            $x86Crt = Join-Path $vcRedistDir.FullName "x86\Microsoft.VC143.CRT"
            if (Test-Path $x86Crt) {
              Copy-Item "$x86Crt\*.dll" -Destination "dist_x86" -Force
              Write-Host "Bundled Visual C++ x86 runtime libraries from $x86Crt"
            }
          }
          foreach ($dll in $crtDlls) {
            if (Test-Path "C:\Windows\SysWOW64\$dll") {
              Copy-Item "C:\Windows\SysWOW64\$dll" -Destination "dist_x86" -Force
            }
          }
          try {
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" -OutFile "dist_x86/vc_redist.x86.exe" -UseBasicParsing
          } catch {
            Write-Host "Warning: Could not download vc_redist.x86.exe"
          }

          Compress-Archive -Path "dist_x86/*" -DestinationPath "MaterialVless-Windows-x86.zip"



          # Build Setup installers via Inno Setup

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (Test-Path $iscc) {

            if (Test-Path "windows/installer_x64.iss") {

              & $iscc "windows/installer_x64.iss"

            }

            if (Test-Path "windows/installer_x86.iss") {

              & $iscc "windows/installer_x86.iss"

            }

          }



      - name: Upload Windows Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: MaterialVless-Windows

          path: |

            MaterialVless-Windows-*.zip

            MaterialVless-Windows-*.exe



  # ==========================================

  # 2. LINUX BUILD (x64 and x86)

  # ==========================================

  build-linux:

    name: Build Linux (x64 / x86)

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Install Linux Dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev



      - name: Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: 'stable'

          cache: true



      - name: Generate Linux Native Files
        run: |
          flutter create . --platforms=linux --org com.materialvless --project-name material_vless
          echo 'add_compile_options(-Wno-deprecated-declarations -Wno-error)' >> linux/CMakeLists.txt

      - name: Install Dependencies
        run: |
          flutter pub get
          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true

      - name: Compile Linux App
        run: |
          export CXXFLAGS="-Wno-deprecated-declarations -Wno-error"
          export CFLAGS="-Wno-deprecated-declarations -Wno-error"
          flutter build linux --release



      - name: Bundle Core & Package x64 and x86
        run: |
          DIST="build/linux/x64/release/bundle"

          # Download Xray-core (x64)
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip" -o xray64.zip
          unzip -o xray64.zip -d xray64_temp
          cp xray64_temp/xray "$DIST/xray"
          cp xray64_temp/geoip.dat "$DIST/geoip.dat"
          cp xray64_temp/geosite.dat "$DIST/geosite.dat"
          chmod +x "$DIST/xray"

          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

          # x86 package
          mkdir -p dist_linux_x86
          cp -r "$DIST/"* dist_linux_x86/

          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-32.zip" -o xray32.zip
          unzip -o xray32.zip -d xray32_temp
          cp xray32_temp/xray dist_linux_x86/xray
          cp xray32_temp/geoip.dat dist_linux_x86/geoip.dat
          cp xray32_temp/geosite.dat dist_linux_x86/geosite.dat
          chmod +x dist_linux_x86/xray

          tar -czvf MaterialVless-Linux-x86.tar.gz -C dist_linux_x86 .



      - name: Upload Linux Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: MaterialVless-Linux

          path: MaterialVless-Linux-*.tar.gz



  # ==========================================

  # 3. MACOS BUILD

  # ==========================================

  build-macos:

    name: Build macOS (MaterialVless)

    runs-on: macos-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4



      - name: Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: 'stable'

          cache: true



      - name: Generate macOS Native Files

        run: flutter create . --platforms=macos --org com.materialvless --project-name material_vless



      - name: Install Dependencies

        run: flutter pub get



      - name: Compile macOS Application

        run: flutter build macos --release



      - name: Bundle Core & Archive

        run: |

          APP_DIR="build/macos/Build/Products/Release/material_vless.app"

          RES_DIR="$APP_DIR/Contents/Resources"

          mkdir -p "$RES_DIR"



          # Xray-core universal binary (arm64 + amd64)
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-macos-arm64-v8a.zip" -o xray_arm64.zip
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-macos-64.zip" -o xray_64.zip
          unzip -o xray_arm64.zip -d xray_arm64_temp
          unzip -o xray_64.zip -d xray_64_temp
          lipo -create "xray_arm64_temp/xray" "xray_64_temp/xray" -output "$RES_DIR/xray"
          chmod +x "$RES_DIR/xray"
          cp xray_arm64_temp/geoip.dat "$RES_DIR/geoip.dat"
          cp xray_arm64_temp/geosite.dat "$RES_DIR/geosite.dat"



          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip



      - name: Upload macOS Artifact

        uses: actions/upload-artifact@v4

        with:

          name: MaterialVless-macOS

          path: MaterialVless-macOS.zip



  # ==========================================

  # 4. PUBLISH RELEASE

  # ==========================================

  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:

      - name: Download Build Artifacts

        uses: actions/download-artifact@v4

        with:

          path: release_staging



      - name: Prepare Final Files

        run: |

          mkdir -p final_assets

          find release_staging -type f -exec mv {} final_assets/ \;

          ls -la final_assets/



      - name: Determine Tag Name

        id: tag_info

        run: |

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then

            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

          else

            echo "tag=v1.0.1" >> $GITHUB_OUTPUT

          fi



      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.tag_info.outputs.tag }}

          name: MaterialVless ${{ steps.tag_info.outputs.tag }}

          draft: false

          prerelease: false

          files: final_assets/*

          body: |
            ### MaterialVless 3.0 (Релиз 3.0 - Многорежимный пинг, Action Modal узлов, вкладка задержки и поддержка)

            Глобальное обновление **MaterialVless 3.0**:
            - **Многорежимный интеллектуальный движок пинга (Ping Engine)**:
              - `via Proxy(GET)`: HTTP GET запрос через туннель прокси к проверочному сайту (честная сквозная проверка веб-доступа в сеть).
              - `via Proxy(HEAD)`: HTTP HEAD запрос через туннель (быстрый опрос заголовков ответа).
              - `TCP`: Нативный сетевой 3-way handshake к хосту и порту сервера (замер чистого сетевого RTT).
              - `ICMP`: Системный эхо-запрос ping операционной системы.
            - **Отдельная вкладка «Пинг и задержка» в настройках**:
              - Переключение между 4 режимами замера на лету.
              - Настройка формата отображения у серверов: `Time (XXXX ms/icon)` с цветными индикаторами качества связи (зеленый/лайм/желтый/красный).
              - Выбор целевого URL для проверки задержки с быстрыми пресетами (Cloudflare 204, Google 204, CacheFly 1MB, Yandex) и ручным вводом.
              - Ползунок настройки таймаута замера (1 - 5 сек).
              - Кнопка массового параллельного замера всех узлов с индикацией прогресса.
            - **Окно быстрых действий по нажатию на сервер (Server Action Modal)**:
              - Замер пинга выбранного сервера в реальном времени.
              - Просмотр и копирование outbound JSON конфигурации узла (Xray format).
              - Быстрый выбор сервера для подключения.
              - Копирование прямой ссылки узла в буфер обмена.
            - **Поддержка проекта (Донат)**:
              - Добавлена кнопка «Поддержать» в AppBar и специальная карточка в настройках со ссылкой на `https://www.donationalerts.com/r/qkryt`.
            - **Исправление багов интерфейса и отображения**:
              - Устранено вертикальное сплющивание текста в одну букву на экранах разной ширины («Шрифт интерфейса», «браже ние»).
              - Адаптирован диалог добавления подписок и серверов (защита от перекрытия клавиатурой и переполнения).
              - Оптимизировано потребление памяти, кэширование обоев и освобождение сетевых сокетов.
            - **Обновление Xray-core до актуальной стабильной версии v26.10.21**:
              - Встроенная нативная поддержка Wintun TUN адаптера (`material-tun`).
              - Полная совместимость с VLESS Reality (`spiderX`, XTLS Vision `flow: xtls-rprx-vision`), gRPC, WebSocket, Trojan, Shadowsocks и VMess.
              - Обновлены официальные гео-базы маршрутизации `geoip.dat` и `geosite.dat`.
            - **Умная гибридная маршрутизация (Russia Preset)**:
              - Прямой обход российских сайтов и сервисов (`geoip:ru`, `geosite:category-ru`, зоны `.ru`, `.su`, `.рф`) с быстрым локальным резолвингом через Yandex DNS (`77.88.8.8`).
              - Защищенный туннель для всех зарубежных ресурсов, мессенджеров и заблокированных сервисов.
            - **Исправления внешнего вида и темы**:
              - Правая панель кнопки подключения гарантированно прозрачна (`Colors.transparent`) при использовании фонового изображения.
              - Защита от наслоения экранов меню и настроек с мгновенным нулевым временем анимации перехода.
              - Поддержка анимированных GIF, автоматическое сохранение обоев в корень как `background.<ext>` и надежное сохранение процента затемнения.
            - **Стабильность и аварийное завершение**:
              - Надежное завершение процессов `xray.exe` и автоматическая очистка Wintun адаптера и системного прокси при отключении.
              - Кнопка аварийного завершения ядра в настройках.
            - **Мгновенная смена обоев и фонового изображения в реальном времени**:
              - Больше не нужно перезаходить в настройки или вручную удалять старую картинку перед выбором новой.
              - Устранена блокировка файлов Windows (OS Error 32) благодаря чтению байтов в память с динамической очисткой кэша.
              - Добавлена полноценная поддержка анимированных `.gif` фонов (`gaplessPlayback: true`).
              - Фоновое изображение сохраняется в корневую папку как `background.<ext>`.
            - **Настройки затемнения фона**:
              - Текст ползунка приведен к строгому виду: `Затемнение фона: {проценты}%` (без приписки `(чуть-чуть)`).
              - Значение затемнения сохраняется персистентно на диск при каждом изменении.
              - Устранено мерцание затемнения при открытии экрана настроек (`themeAnimationDuration: Duration.zero`).
            - **Полная прозрачность правой панели подключения**:
              - Правая область кнопки включения полностью прозрачна (`Colors.transparent`), открывая выбранный фон по всему окну приложения без темных прямоугольников.
            - **Плавный кинетический скроллинг**:
              - Плавная интерполяция колесика мыши по спискам серверов и горизонтальная навигация по подпискам.
            - **Журналирование**:
              - Подробное логирование работы Xray и клиента в корневом `log.txt`.
            - **Управление процессами Xray-core**:
              - Принудительное завершение всех процессов xray.exe при выключении VPN и перед каждым новым запуском.
              - Аварийная кнопка в настройках для моментального сброса системных прокси и процессов Xray.
            - **Интерфейс и шрифты**:
              - Исправлено наложение галочки на иконку булавки на закрепленных подписках.
              - Персистентное сохранение и динамическая ширина меню выбора локальных шрифтов из `/MaterialVless/customfonts`.
              - Кнопка обратной связи в карточке «Информация о программе» с переходом в Telegram и GitHub Issues.
            - **Сохранение и отображение кастомных шрифтов**:
              - Шрифт сохраняется персистентно и восстанавливается при перезапуске приложения из /MaterialVless/customfonts.
              - Меню выбора шрифта теперь компактное и аккуратно подстраивается под длину названия шрифта.
            - **Кнопка обратной связи и диалог контактов**:
              - В карточку «Информация о программе» добавлена кнопка «Нашли ошибку? Сообщи автору».
              - Диалог с кнопками быстрого перехода в Telegram-канал, личный Telegram и GitHub Issues («Пишите предложения и ошибки»).
            - **Исправление багов интерфейса**:
              - Убрана галочка на закрепленных подписках — активная вкладка просто подсвечивается без перекрытия иконки булавки.
              - Убрана лишняя вкладка «Все (45)», при наличии ссылок на серверы отображается вкладка «Сервера».

            - **Ползунок прокрутки списка серверов (Scrollbar)**:

              - Ползунок справа теперь выделен и зависит строго от длины списка серверов, как во всех классических клиентах.

              - Шапка подписки (трафик, дата, кнопки управления) зафиксирована сверху и не уезжает при прокрутке серверов.

              - Добавлен удобный переключатель вкладок («Все», отдельные подписки, «Ручные узлы»).

              - Установлен комфортный минимальный размер ползунка (`minThumbLength: 48`).

            - **Устранение ошибки PR_CONNECT_RESET_ERROR**:

              - Стек TUN переведён на `mixed` (gVisor TCP stack), что исключает генерацию Windows TCP RST.

              - Добавлена полноценная поддержка протокола ALPN для VLESS Reality / TLS и корректная передача параметра `spider_x`.

              - Увеличен таймаут сниффинга TLS-хэндшейка.

            - **Фирменный логотип Material You**:

              - Нарисован стильный логотип в органичном дизайне Material You (скругленный squircle, плавная лента M&V и пастельные градиенты).

              - Исправлен установщик: ярлык на Рабочем столе теперь всегда получает фирменную иконку вместо иконки Flutter.

            - **Кастомные локальные шрифты (/MaterialVless/customfonts)**:

              - Пользовательские шрифты (.ttf / .otf) сохраняются в корневую папку `/MaterialVless/customfonts`.

              - Добавлено меню «Локальные шрифты» с отображением имени шрифта, полного пути (например, `minecraft.ttf` `C:/Program Files/MaterialVless/customfonts/minecraft.ttf`), быстрым применением и удалением.

              - Все локальные шрифты автоматически доступны в выпадающем списке тем.

            - **Интерфейс и заголовок**:

              - Заголовок окна изменён с `material_vless` на `MaterialVless`.

              - Убрана внешняя вращающаяся анимация вокруг кнопки при подключении (внутри кнопки уже есть индикатор загрузки).



            #### Release Binaries / Файлы релиза:

            - **Windows (x64) Installer:** MaterialVless-Windows-x64-Setup.exe

            - **Windows (x64) Portable:** MaterialVless-Windows-x64.zip

            - **Windows (x86) Installer:** MaterialVless-Windows-x86-Setup.exe

            - **Windows (x86) Portable:** MaterialVless-Windows-x86.zip

            - **Linux (x64):** MaterialVless-Linux-x64.tar.gz

            - **Linux (x86):** MaterialVless-Linux-x86.tar.gz

            - **macOS:** MaterialVless-macOS.zip

