name: Build & Release MaterialVless

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: 'v24.11.30'
  WINTUN_VERSION: '0.14.1'

jobs:
  # ==========================================
  # 1. WINDOWS BUILD (x64 and x86 support)
  # ==========================================
  build-windows:
    name: Build Windows (MaterialVless)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Native Files
        run: flutter create . --platforms=windows --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Windows App
        run: flutter build windows --release

      - name: Download Xray & Wintun (x64 and x86)
        shell: pwsh
        run: |
          $TargetDir = "build/windows/x64/runner/Release"
          
          # Загрузка ядра Xray (x64)
          $XrayUrl = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $XrayUrl -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray_core"
          
          Copy-Item "xray_core/xray.exe" -Destination "$TargetDir"
          Copy-Item "xray_core/geoip.dat" -Destination "$TargetDir"
          Copy-Item "xray_core/geosite.dat" -Destination "$TargetDir"
          
          # Загрузка драйвера Wintun
          $WintunUrl = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$TargetDir"

          # Загрузка x86 компонентов
          $XrayX86Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-32.zip"
          Invoke-WebRequest -Uri $XrayX86Url -OutFile "xray32.zip"
          Expand-Archive -Path "xray32.zip" -DestinationPath "xray_x86"
          mkdir -p "$TargetDir/x86"
          Copy-Item "xray_x86/xray.exe" -Destination "$TargetDir/x86"
          Copy-Item "wintun_driver/wintun/bin/x86/wintun.dll" -Destination "$TargetDir/x86"

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "MaterialVless-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Windows-x64
          path: MaterialVless-Windows-x64.zip

  # ==========================================
  # 2. ANDROID BUILD (arm64, armeabi-v7a, x86_64, x86)
  # ==========================================
  build-android:
    name: Build Android APKs (MaterialVless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Native Files
        run: flutter create . --platforms=android --org com.materialvless --project-name material_vless

      - name: Fix Android CompileSdk
        run: |
          echo 'allprojects { subprojects { afterEvaluate { project -> if (project.hasProperty("android")) { project.android { compileSdkVersion 34 } } } } }' >> android/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Android APKs (Split with x86 support)
        run: flutter build apk --split-per-abi --release --target-platform android-arm,android-arm64,android-x86,android-x64

      - name: Organize APK Files
        run: |
          mkdir -p output_apks
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/MaterialVless-Android-arm64-v8a.apk || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apks/MaterialVless-Android-armeabi-v7a.apk || true
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp build/app/outputs/flutter-apk/app-x86_64-release.apk output_apks/MaterialVless-Android-x86_64.apk || true
          [ -f build/app/outputs/flutter-apk/app-x86-release.apk ] && cp build/app/outputs/flutter-apk/app-x86-release.apk output_apks/MaterialVless-Android-x86.apk || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Android-APKs
          path: output_apks/*.apk

  # ==========================================
  # 3. LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux x64 (MaterialVless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Linux Native Files
        run: flutter create . --platforms=linux --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Linux App
        run: flutter build linux --release

      - name: Bundle Core & Package
        run: |
          DIST="build/linux/x64/release/bundle"
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip" -o xray.zip
          unzip xray.zip -d xray_temp
          cp xray_temp/xray "$DIST/"
          cp xray_temp/geoip.dat "$DIST/"
          cp xray_temp/geosite.dat "$DIST/"
          chmod +x "$DIST/xray"
          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Linux-x64
          path: MaterialVless-Linux-x64.tar.gz

  # ==========================================
  # 4. MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS (MaterialVless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate macOS Native Files
        run: flutter create . --platforms=macos --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile macOS Application
        run: flutter build macos --release

      - name: Bundle Core & Archive
        run: |
          APP_DIR="build/macos/Build/Products/Release/material_vless.app"
          RES_DIR="$APP_DIR/Contents/Resources"
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-macos-arm64-v8a.zip" -o xray.zip
          unzip xray.zip -d xray_temp
          mkdir -p "$RES_DIR"
          cp xray_temp/xray "$RES_DIR/"
          cp xray_temp/geoip.dat "$RES_DIR/"
          cp xray_temp/geosite.dat "$RES_DIR/"
          chmod +x "$RES_DIR/xray"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-macOS
          path: MaterialVless-macOS.zip

  # ==========================================
  # 5. IOS BUILD (.ipa Sideload Package)
  # ==========================================
  build-ios:
    name: Build iOS IPA (MaterialVless)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Files
        run: flutter create . --platforms=ios --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Workspace without Code Signing
        run: |
          flutter build ios --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "build/ios_derived/Build/Products/Release-iphoneos/Runner.app" Payload/
          zip -r MaterialVless-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-iOS-IPA
          path: MaterialVless-iOS.ipa

  # ==========================================
  # 6. PUBLISH RELEASE
  # ==========================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-android, build-linux, build-macos, build-ios]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare Final Files
        run: |
          mkdir -p final_assets
          find release_staging -type f -exec mv {} final_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MaterialVless ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### MaterialVless Client — Релиз ${{ github.ref_name }}
            
            Полноценный кроссплатформенный клиент VLESS / Reality / gRPC / Hysteria с ядром Xray-core и интерфейсом Material You.
            
            #### Поддерживаемые платформы и архитектуры:
            - **Android:** Split APKs для `arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86` (полная поддержка 32/64-бит).
            - **Windows:** `MaterialVless-Windows-x64.zip` (с поддержкой x64 и x86 бинарников ядра Xray и драйвера Wintun).
            - **Linux (x64):** `MaterialVless-Linux-x64.tar.gz`.
            - **macOS:** `MaterialVless-macOS.zip`.
            - **iOS (.ipa):** `MaterialVless-iOS.ipa` (пакет для Sideloadly / TrollStore / AltStore).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
