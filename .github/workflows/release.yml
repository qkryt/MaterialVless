name: Build & Release MaterialVless

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: 'v24.11.30'
  HYSTERIA_VERSION: 'app/v2.13.0'
  WINTUN_VERSION: '0.14.1'

jobs:
  # ==========================================
  # 1. WINDOWS BUILD (x64 and x86)
  # ==========================================
  build-windows:
    name: Build Windows (x64 / x86)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Native Files
        run: flutter create . --platforms=windows --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Windows App
        run: flutter build windows --release

      - name: Package Windows x64 and x86
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          
          # Загрузка ядра Xray (x64)
          $Xray64Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $Xray64Url -OutFile "xray64.zip"
          Expand-Archive -Path "xray64.zip" -DestinationPath "xray_64"
          
          # Загрузка ядра Hysteria 2 (x64)
          $Hy64Url = "https://github.com/HyNetworks/hysteria/releases/download/${{ env.HYSTERIA_VERSION }}/hysteria-windows-amd64.exe"
          Invoke-WebRequest -Uri $Hy64Url -OutFile "hysteria64.exe"

          # Загрузка драйвера Wintun
          $WintunUrl = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"

          # Формирование Windows x64
          Copy-Item "xray_64/xray.exe" -Destination "$ReleaseDir"
          Copy-Item "hysteria64.exe" -Destination "$ReleaseDir/hysteria.exe"
          Copy-Item "xray_64/geoip.dat" -Destination "$ReleaseDir"
          Copy-Item "xray_64/geosite.dat" -Destination "$ReleaseDir"
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$ReleaseDir"
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "MaterialVless-Windows-x64.zip"

          # Формирование Windows x86
          $Xray32Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-32.zip"
          Invoke-WebRequest -Uri $Xray32Url -OutFile "xray32.zip"
          Expand-Archive -Path "xray32.zip" -DestinationPath "xray_32"
          
          $Hy32Url = "https://github.com/HyNetworks/hysteria/releases/download/${{ env.HYSTERIA_VERSION }}/hysteria-windows-386.exe"
          Invoke-WebRequest -Uri $Hy32Url -OutFile "hysteria32.exe"

          mkdir -p "dist_x86"
          Copy-Item "$ReleaseDir/*" -Destination "dist_x86" -Recurse
          Copy-Item "xray_32/xray.exe" -Destination "dist_x86" -Force
          Copy-Item "hysteria32.exe" -Destination "dist_x86/hysteria.exe" -Force
          Copy-Item "xray_32/geoip.dat" -Destination "dist_x86" -Force
          Copy-Item "xray_32/geosite.dat" -Destination "dist_x86" -Force
          Copy-Item "wintun_driver/wintun/bin/x86/wintun.dll" -Destination "dist_x86/wintun.dll" -Force
          Compress-Archive -Path "dist_x86/*" -DestinationPath "MaterialVless-Windows-x86.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Windows
          path: MaterialVless-Windows-*.zip

  # ==========================================
  # 2. LINUX BUILD (x64 and x86)
  # ==========================================
  build-linux:
    name: Build Linux (x64 / x86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Linux Native Files
        run: flutter create . --platforms=linux --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Linux App
        run: flutter build linux --release

      - name: Bundle Core & Package x64 and x86
        run: |
          DIST="build/linux/x64/release/bundle"
          
          # x64 package
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip" -o xray64.zip
          unzip xray64.zip -d xray64_temp
          curl -L "https://github.com/HyNetworks/hysteria/releases/download/${{ env.HYSTERIA_VERSION }}/hysteria-linux-amd64" -o "$DIST/hysteria"
          cp xray64_temp/xray "$DIST/"
          cp xray64_temp/geoip.dat "$DIST/"
          cp xray64_temp/geosite.dat "$DIST/"
          chmod +x "$DIST/xray"
          chmod +x "$DIST/hysteria"
          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

          # x86 package
          mkdir -p dist_linux_x86
          cp -r "$DIST/"* dist_linux_x86/
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-32.zip" -o xray32.zip
          unzip xray32.zip -d xray32_temp
          curl -L "https://github.com/HyNetworks/hysteria/releases/download/${{ env.HYSTERIA_VERSION }}/hysteria-linux-386" -o "dist_linux_x86/hysteria"
          cp xray32_temp/xray dist_linux_x86/
          cp xray32_temp/geoip.dat dist_linux_x86/
          cp xray32_temp/geosite.dat dist_linux_x86/
          chmod +x dist_linux_x86/xray
          chmod +x dist_linux_x86/hysteria
          tar -czvf MaterialVless-Linux-x86.tar.gz -C dist_linux_x86 .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Linux
          path: MaterialVless-Linux-*.tar.gz

  # ==========================================
  # 3. MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS (MaterialVless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate macOS Native Files
        run: flutter create . --platforms=macos --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile macOS Application
        run: flutter build macos --release

      - name: Bundle Core & Archive
        run: |
          APP_DIR="build/macos/Build/Products/Release/material_vless.app"
          RES_DIR="$APP_DIR/Contents/Resources"
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-macos-arm64-v8a.zip" -o xray.zip
          unzip xray.zip -d xray_temp
          mkdir -p "$RES_DIR"
          curl -L "https://github.com/HyNetworks/hysteria/releases/download/${{ env.HYSTERIA_VERSION }}/hysteria-darwin-arm64" -o "$RES_DIR/hysteria"
          cp xray_temp/xray "$RES_DIR/"
          cp xray_temp/geoip.dat "$RES_DIR/"
          cp xray_temp/geosite.dat "$RES_DIR/"
          chmod +x "$RES_DIR/xray"
          chmod +x "$RES_DIR/hysteria"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-macOS
          path: MaterialVless-macOS.zip

  # ==========================================
  # 4. PUBLISH RELEASE
  # ==========================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare Final Files
        run: |
          mkdir -p final_assets
          find release_staging -type f -exec mv {} final_assets/ \;
          ls -la final_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: MaterialVless ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### MaterialVless Client — Релиз ${{ steps.tag_info.outputs.tag }}
            
            Кроссплатформенный клиент VLESS / Reality / gRPC / Hysteria 2 с ядрами Xray-core + Hysteria и интерфейсом Material You.
            
            #### Поддерживаемые платформы:
            - **Windows (x64):** `MaterialVless-Windows-x64.zip` (Xray + Hysteria 2 + Wintun x64 + GeoIP/GeoSite)
            - **Windows (x86):** `MaterialVless-Windows-x86.zip` (Xray + Hysteria 2 + Wintun x86 + GeoIP/GeoSite)
            - **Linux (x64):** `MaterialVless-Linux-x64.tar.gz` (Xray + Hysteria 2 + GeoIP/GeoSite)
            - **Linux (x86):** `MaterialVless-Linux-x86.tar.gz` (Xray + Hysteria 2 + GeoIP/GeoSite)
            - **macOS:** `MaterialVless-macOS.zip` (Universal)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
