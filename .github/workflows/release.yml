name: Build & Release MaterialVless

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: 'v24.11.30'
  WINTUN_VERSION: '0.14.1'

jobs:
  # ==========================================
  # 1. WINDOWS BUILD (x64 and x86)
  # ==========================================
  build-windows:
    name: Build Windows (x64 / x86)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Native Files
        run: flutter create . --platforms=windows --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Windows App
        run: flutter build windows --release

      - name: Package Windows x64 and x86
        shell: pwsh
        run: |
          $ReleaseDir = "build/windows/x64/runner/Release"
          
          # Загрузка ядра Xray (x64)
          $Xray64Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $Xray64Url -OutFile "xray64.zip"
          Expand-Archive -Path "xray64.zip" -DestinationPath "xray_64"
          
          # Загрузка драйвера Wintun
          $WintunUrl = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"

          # Формирование Windows x64
          Copy-Item "xray_64/xray.exe" -Destination "$ReleaseDir"
          Copy-Item "xray_64/geoip.dat" -Destination "$ReleaseDir"
          Copy-Item "xray_64/geosite.dat" -Destination "$ReleaseDir"
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$ReleaseDir"
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "MaterialVless-Windows-x64.zip"

          # Формирование Windows x86
          $Xray32Url = "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-windows-32.zip"
          Invoke-WebRequest -Uri $Xray32Url -OutFile "xray32.zip"
          Expand-Archive -Path "xray32.zip" -DestinationPath "xray_32"
          
          mkdir -p "dist_x86"
          Copy-Item "$ReleaseDir/*" -Destination "dist_x86" -Recurse
          Copy-Item "xray_32/xray.exe" -Destination "dist_x86" -Force
          Copy-Item "xray_32/geoip.dat" -Destination "dist_x86" -Force
          Copy-Item "xray_32/geosite.dat" -Destination "dist_x86" -Force
          Copy-Item "wintun_driver/wintun/bin/x86/wintun.dll" -Destination "dist_x86/wintun.dll" -Force
          Compress-Archive -Path "dist_x86/*" -DestinationPath "MaterialVless-Windows-x86.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Windows
          path: MaterialVless-Windows-*.zip

  # ==========================================
  # 2. ANDROID BUILD (All APKs)
  # ==========================================
  build-android:
    name: Build Android APKs (All ABIs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Native Files
        run: flutter create . --platforms=android --org com.materialvless --project-name material_vless

      - name: Fix Android CompileSdk
        run: |
          echo 'allprojects { subprojects { afterEvaluate { project -> if (project.hasProperty("android")) { project.android { compileSdkVersion 34 } } } } }' >> android/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Android APKs via Gradle
        run: |
          # Сборка через Gradle напрямую во избежание сбоев поиска путей во Flutter CLI
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || true
          cd ..
          
          # Сборка Flutter Release APK
          flutter build apk --release --no-tree-shake-icons || true

      - name: Collect and Organize Android APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output_apks"
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output_apks/" \;
          
          cd "$GITHUB_WORKSPACE/output_apks"
          ls -la
          
          # Стандартизация названий файлов для релиза
          for f in *.apk; do
            if [[ "$f" == *"arm64-v8a"* ]]; then cp "$f" "MaterialVless-Android-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then cp "$f" "MaterialVless-Android-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then cp "$f" "MaterialVless-Android-x86_64.apk"
            elif [[ "$f" == *"app-release"* ]]; then cp "$f" "MaterialVless-Android-Universal.apk"
            fi
          done
          
          # Если имя не переименовалось, гарантируем наличие главного APK
          if [ ! -f "MaterialVless-Android-Universal.apk" ]; then
            first_apk=$(ls -1 *.apk 2>/dev/null | head -n 1)
            [ -n "$first_apk" ] && cp "$first_apk" "MaterialVless-Android-Universal.apk"
          fi
          
          ls -la

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Android-APKs
          path: output_apks/*.apk

  # ==========================================
  # 3. IOS BUILD (.ipa via Xcode)
  # ==========================================
  build-ios:
    name: Build iOS IPA (MaterialVless)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS Native Files
        run: flutter create . --platforms=ios --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare iOS Config
        run: flutter build ios --config-only

      - name: Build App via xcodebuild
        run: |
          # Сборка через Xcode без требования учетной записи разработчика
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r MaterialVless-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-iOS-IPA
          path: MaterialVless-iOS.ipa

  # ==========================================
  # 4. LINUX BUILD (x64 and x86)
  # ==========================================
  build-linux:
    name: Build Linux (x64 / x86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Linux Native Files
        run: flutter create . --platforms=linux --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Linux App
        run: flutter build linux --release

      - name: Bundle Core & Package x64 and x86
        run: |
          DIST="build/linux/x64/release/bundle"
          
          # x64 package
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-64.zip" -o xray64.zip
          unzip xray64.zip -d xray64_temp
          cp xray64_temp/xray "$DIST/"
          cp xray64_temp/geoip.dat "$DIST/"
          cp xray64_temp/geosite.dat "$DIST/"
          chmod +x "$DIST/xray"
          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

          # x86 package
          mkdir -p dist_linux_x86
          cp -r "$DIST/"* dist_linux_x86/
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-linux-32.zip" -o xray32.zip
          unzip xray32.zip -d xray32_temp
          cp xray32_temp/xray dist_linux_x86/
          cp xray32_temp/geoip.dat dist_linux_x86/
          cp xray32_temp/geosite.dat dist_linux_x86/
          chmod +x dist_linux_x86/xray
          tar -czvf MaterialVless-Linux-x86.tar.gz -C dist_linux_x86 .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Linux
          path: MaterialVless-Linux-*.tar.gz

  # ==========================================
  # 5. MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS (MaterialVless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate macOS Native Files
        run: flutter create . --platforms=macos --org com.materialvless --project-name material_vless

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile macOS Application
        run: flutter build macos --release

      - name: Bundle Core & Archive
        run: |
          APP_DIR="build/macos/Build/Products/Release/material_vless.app"
          RES_DIR="$APP_DIR/Contents/Resources"
          curl -L "https://github.com/XTLS/Xray-core/releases/download/${{ env.XRAY_VERSION }}/Xray-macos-arm64-v8a.zip" -o xray.zip
          unzip xray.zip -d xray_temp
          mkdir -p "$RES_DIR"
          cp xray_temp/xray "$RES_DIR/"
          cp xray_temp/geoip.dat "$RES_DIR/"
          cp xray_temp/geosite.dat "$RES_DIR/"
          chmod +x "$RES_DIR/xray"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-macOS
          path: MaterialVless-macOS.zip

  # ==========================================
  # 6. PUBLISH RELEASE & GEO DATA
  # ==========================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-android, build-linux, build-macos, build-ios]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Download Official GeoIP and GeoSite directly to Release
        run: |
          mkdir -p final_assets
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat" -o final_assets/geoip.dat
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat" -o final_assets/geosite.dat

      - name: Prepare Final Files
        run: |
          find release_staging -type f -exec mv {} final_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MaterialVless ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### MaterialVless Client — Релиз ${{ github.ref_name }}
            
            Полноценный кроссплатформенный клиент VLESS / Reality / gRPC / Hysteria с ядром Xray-core и интерфейсом Material You.
            
            #### Поддерживаемые платформы и архитектуры:
            - **Windows (x64):** `MaterialVless-Windows-x64.zip` (Xray x64 + Wintun x64)
            - **Windows (x86):** `MaterialVless-Windows-x86.zip` (Xray 32-bit x86 + Wintun x86)
            - **Android (Universal):** `MaterialVless-Android-Universal.apk` (Универсальный APK для всех процессоров)
            - **Android (Splits):** `arm64-v8a`, `armeabi-v7a`, `x86_64`
            - **iOS (.ipa):** `MaterialVless-iOS.ipa` (для Sideloadly / TrollStore / AltStore / Scarlet)
            - **Linux (x64):** `MaterialVless-Linux-x64.tar.gz`
            - **Linux (x86):** `MaterialVless-Linux-x86.tar.gz`
            - **macOS:** `MaterialVless-macOS.zip` (Universal Apple Silicon + Intel)
            - **Базы правил:** `geoip.dat` и `geosite.dat` прикреплены прямо к релизу для автономной работы
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
