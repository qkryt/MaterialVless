name: Build & Release MaterialVless 2.0 (Qt6)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: '1.14.4'
  WINTUN_VERSION: '0.14.1'

jobs:
  # ==========================================
  # 1. WINDOWS BUILD (Qt6 Native x64 and x86)
  # ==========================================
  build-windows:
    name: Build Windows (Qt6 x64 / x86)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests pyinstaller

      - name: Build Windows Executable (Qt6)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "material_vless" --icon "assets/icons/app_icon.ico" --uac-admin main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Package Windows x64 and x86
        shell: pwsh
        run: |
          $ReleaseDir = "dist/material_vless"
          
          # Download sing-box (x64)
          $Sb64Url = "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-windows-amd64.zip"
          Invoke-WebRequest -Uri $Sb64Url -OutFile "sb64.zip"
          Expand-Archive -Path "sb64.zip" -DestinationPath "sb_64"

          # Download sing-box (x86)
          $Sb32Url = "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-windows-386.zip"
          Invoke-WebRequest -Uri $Sb32Url -OutFile "sb32.zip"
          Expand-Archive -Path "sb32.zip" -DestinationPath "sb_32"

          # Download Wintun
          $WintunUrl = "https://www.wintun.net/builds/wintun-${{ env.WINTUN_VERSION }}.zip"
          Invoke-WebRequest -Uri $WintunUrl -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_driver"

          # GeoIP & GeoSite
          $GeoipUrl = "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat"
          $GeositeUrl = "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat"
          Invoke-WebRequest -Uri $GeoipUrl -OutFile "$ReleaseDir/geoip.dat"
          Invoke-WebRequest -Uri $GeositeUrl -OutFile "$ReleaseDir/geosite.dat"

          # Form Windows x64
          Copy-Item "sb_64/sing-box-${{ env.SING_BOX_VERSION }}-windows-amd64/sing-box.exe" -Destination "$ReleaseDir/sing-box.exe"
          Copy-Item "wintun_driver/wintun/bin/amd64/wintun.dll" -Destination "$ReleaseDir/wintun.dll"
          New-Item -ItemType Directory -Path "$ReleaseDir/assets/icons" -Force
          Copy-Item "assets/icons/app_icon.ico" -Destination "$ReleaseDir/assets/icons/app_icon.ico" -Force
          Copy-Item "assets/icons/app_icon.png" -Destination "$ReleaseDir/assets/icons/app_icon.png" -Force

          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "MaterialVless-Windows-x64.zip"

          # Form Windows x86
          mkdir -p "dist_x86"
          Copy-Item "$ReleaseDir/*" -Destination "dist_x86" -Recurse
          Copy-Item "sb_32/sing-box-${{ env.SING_BOX_VERSION }}-windows-386/sing-box.exe" -Destination "dist_x86/sing-box.exe" -Force
          Copy-Item "wintun_driver/wintun/bin/x86/wintun.dll" -Destination "dist_x86/wintun.dll" -Force
          Compress-Archive -Path "dist_x86/*" -DestinationPath "MaterialVless-Windows-x86.zip"

          # Build Inno Setup Installers
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "windows/installer_x64.iss"
            & $iscc "windows/installer_x86.iss"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Windows
          path: |
            MaterialVless-Windows-*.zip
            MaterialVless-Windows-*.exe

  # ==========================================
  # 2. LINUX BUILD (Qt6 x64 and x86)
  # ==========================================
  build-linux:
    name: Build Linux (Qt6 x64 / x86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libegl1
          python -m pip install --upgrade pip
          pip install PyQt6 requests pyinstaller

      - name: Compile Linux App with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "material_vless" main.py

      - name: Bundle Core & Package x64 and x86
        run: |
          DIST="dist/material_vless"
          
          # Download sing-box (x64)
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-linux-amd64.tar.gz" -o sb64.tar.gz
          tar -xvf sb64.tar.gz
          cp "sing-box-${{ env.SING_BOX_VERSION }}-linux-amd64/sing-box" "$DIST/sing-box"
          chmod +x "$DIST/sing-box"

          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat" -o "$DIST/geoip.dat"
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat" -o "$DIST/geosite.dat"

          mkdir -p "$DIST/assets/icons"
          cp assets/icons/* "$DIST/assets/icons/" 2>/dev/null || true

          tar -czvf MaterialVless-Linux-x64.tar.gz -C "$DIST" .

          # x86 package
          mkdir -p dist_linux_x86
          cp -r "$DIST/"* dist_linux_x86/
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-linux-386.tar.gz" -o sb32.tar.gz
          tar -xvf sb32.tar.gz
          cp "sing-box-${{ env.SING_BOX_VERSION }}-linux-386/sing-box" dist_linux_x86/sing-box
          chmod +x dist_linux_x86/sing-box
          tar -czvf MaterialVless-Linux-x86.tar.gz -C dist_linux_x86 .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-Linux
          path: MaterialVless-Linux-*.tar.gz

  # ==========================================
  # 3. MACOS BUILD (Qt6)
  # ==========================================
  build-macos:
    name: Build macOS (Qt6 MaterialVless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macOS Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests pyinstaller

      - name: Compile macOS Application with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "MaterialVless" --icon "assets/icons/app_icon.ico" main.py

      - name: Bundle Core & Archive
        run: |
          APP_DIR="dist/MaterialVless.app"
          RES_DIR="$APP_DIR/Contents/MacOS"
          mkdir -p "$RES_DIR"

          # Sing-box universal binary (arm64 + amd64)
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-darwin-arm64.tar.gz" -o sb_arm64.tar.gz
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SING_BOX_VERSION }}/sing-box-${{ env.SING_BOX_VERSION }}-darwin-amd64.tar.gz" -o sb_amd64.tar.gz
          tar -xzf sb_arm64.tar.gz
          tar -xzf sb_amd64.tar.gz
          lipo -create "sing-box-${{ env.SING_BOX_VERSION }}-darwin-arm64/sing-box" "sing-box-${{ env.SING_BOX_VERSION }}-darwin-amd64/sing-box" -output "$RES_DIR/sing-box"
          chmod +x "$RES_DIR/sing-box"

          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geoip.dat" -o "$RES_DIR/geoip.dat"
          curl -L "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/release/geosite.dat" -o "$RES_DIR/geosite.dat"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" MaterialVless-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialVless-macOS
          path: MaterialVless-macOS.zip

  # ==========================================
  # 4. PUBLISH RELEASE
  # ==========================================
  publish-release:
    name: Publish Release Packages
    needs: [build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: Prepare Final Files
        run: |
          mkdir -p final_assets
          find release_staging -type f -exec mv {} final_assets/ \;
          ls -la final_assets/

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: MaterialVless ${{ steps.tag_info.outputs.tag }} (Qt6 Major Release)
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### ⚡ MaterialVless Client — Крупный релиз ${{ steps.tag_info.outputs.tag }} (Qt6 Edition)
            
            Полноценный десктопный VLESS / Reality / Hysteria2 VPN-клиент, полностью переписанный на нативный фреймворк **Qt6** с производительным движком **sing-box 1.14** и виртуальным сетевым адаптером Wintun.
            
            #### 🌟 Нововведения версии 2.0:
            1. **🎨 Полный переход на Qt6 (без Flutter):**
               - Чистый, нативный интерфейс в стиле Qt6 Fusion: графитовая палитра, четкие 1px границы, плавные анимации, аппаратное ускорение и мгновенный отклик без накладных расходов.
            2. **🛡️ Активные переключатели DNS и локальной сети:**
               - **Защищенный DNS (DoH)**: шифрованные запросы Cloudflare (1.1.1.1) и Google (8.8.8.8) внутри защищенного туннеля с возможностью включения/отключения.
               - **Обход локальной сети (LAN)**: настраиваемый прямой доступ к домашним устройствам и локальным подсетям (192.168.*, 10.*, 172.16.*).
            3. **⏱️ Настраиваемый таймаут пинга (от 1 до 5 секунд):**
               - Интерактивный слайдер в настройках для выбора задержки отклика от 1 до 5 сек.
            4. **🔤 Импорт пользовательских шрифтов (.ttf, .otf):**
               - Возможность загрузить любой шрифт операционной системы и динамически применить его ко всему интерфейсу приложения с возможностью сброса на системный.
            5. **🌐 Расширенный каталог User-Agent:**
               - Поддержка более 14 популярных User-Agent (v2rayN, sing-box, ClashMeta, Shadowrocket, QuantumultX, Surge, FlClash, NekoRay, Chrome, Firefox) + поле для ввода любого произвольного User-Agent.
            6. **📌 Системный трей:**
               - Убрана лишняя информационная плашка «Фоновая работа».
               - Контекстное меню трея со строгими опциями: «Открыть», «Перезагрузить ядро», «Выйти».
            7. **✏️ Редактирование адреса подписки:**
               - В окне настроек подписки появилось полноценное редактируемое поле URL — теперь можно менять адрес подписки напрямую без повторного добавления.
            8. **💎 Единый официальный логотип:**
               - Утвержден единый высококачественный векторный логотип MaterialVless для окна программы, системного трея, установщика Inno Setup и файлов репозитория.
            9. **🚀 Двойной режим работы (TUN + Прокси):**
               - Надежный драйвер Wintun системного уровня и автоматическая очистка системного прокси при выходе.
            
            #### 📦 Файлы релиза:
            - **Windows (x64) Installer:** `MaterialVless-Windows-x64-Setup.exe`
            - **Windows (x64) Portable:** `MaterialVless-Windows-x64.zip`
            - **Windows (x86) Installer:** `MaterialVless-Windows-x86-Setup.exe`
            - **Windows (x86) Portable:** `MaterialVless-Windows-x86.zip`
            - **Linux (x64):** `MaterialVless-Linux-x64.tar.gz`
            - **Linux (x86):** `MaterialVless-Linux-x86.tar.gz`
            - **macOS:** `MaterialVless-macOS.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
